<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#30363d" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#30363d"/>
      <stop offset="0.85" stop-color="#30363d"/>
      <stop offset="1" stop-color="#30363d" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#36BCF7" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#36BCF7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="131" width="1200" height="2" fill="url(#ground)"/>

  <!-- Whole scene walks from left to right and loops -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="-260 0" to="1380 0" dur="16s" repeatCount="indefinite"/>

    <!-- Ball of yarn rolling ahead of the cat -->
    <g transform="translate(150 118)">
      <ellipse cx="0" cy="13" rx="14" ry="3" fill="#000" fill-opacity="0.25"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
        <circle r="13" fill="#7C5CFF"/>
        <path d="M-12,-4 Q0,-14 12,-4 M-13,3 Q0,-8 13,3 M-9,9 Q0,1 9,9 M-4,-12 Q6,0 -4,12" fill="none" stroke="#c4b5fd" stroke-width="1.6"/>
      </g>
      <!-- loose thread trailing back toward the cat -->
      <path d="M-12,8 Q-40,16 -70,10" fill="none" stroke="#7C5CFF" stroke-width="1.6" stroke-linecap="round">
        <animate attributeName="d" values="M-12,8 Q-40,16 -70,10;M-12,8 Q-40,4 -70,12;M-12,8 Q-40,16 -70,10" dur="0.8s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- The cat -->
    <g transform="translate(0 130)">
      <ellipse cx="4" cy="2" rx="46" ry="4" fill="#000" fill-opacity="0.25"/>

      <!-- back legs (pair A) -->
      <g transform="translate(-24 -22)">
        <animateTransform attributeName="transform" type="rotate" values="-18 0 0;18 0 0;-18 0 0" dur="0.5s" repeatCount="indefinite" additive="sum"/>
        <rect x="-4" y="0" width="8" height="22" rx="4" fill="#1f2630"/>
      </g>
      <!-- front legs (pair A) -->
      <g transform="translate(26 -22)">
        <animateTransform attributeName="transform" type="rotate" values="18 0 0;-18 0 0;18 0 0" dur="0.5s" repeatCount="indefinite" additive="sum"/>
        <rect x="-4" y="0" width="8" height="22" rx="4" fill="#1f2630"/>
      </g>

      <!-- body bobbing group -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -2.5;0 0" dur="0.25s" repeatCount="indefinite"/>

        <!-- tail -->
        <g transform="translate(-40 -46)">
          <path d="M0,0 C-30,-4 -34,-40 -14,-52" fill="none" stroke="#2b3440" stroke-width="9" stroke-linecap="round">
            <animateTransform attributeName="transform" type="rotate" values="-14 0 0;16 0 0;-14 0 0" dur="1.1s" repeatCount="indefinite"/>
          </path>
        </g>

        <!-- body -->
        <ellipse cx="0" cy="-40" rx="46" ry="22" fill="#2b3440"/>
        <ellipse cx="6" cy="-30" rx="30" ry="10" fill="#36404d"/>
        <!-- stripes -->
        <path d="M-20,-60 q4,10 0,18 M-6,-62 q4,10 0,18 M8,-61 q4,10 0,17" fill="none" stroke="#1f2630" stroke-width="3.5" stroke-linecap="round"/>

        <!-- head (bobs a little extra) -->
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="0.5s" repeatCount="indefinite"/>
          <!-- ears -->
          <polygon points="30,-74 33,-98 48,-80" fill="#2b3440"/>
          <polygon points="33,-78 35,-92 43,-81" fill="#f472b6" fill-opacity="0.75"/>
          <polygon points="52,-80 64,-98 66,-72" fill="#2b3440">
            <animateTransform attributeName="transform" type="rotate" values="0 58 -78;0 58 -78;-12 58 -78;0 58 -78;0 58 -78" keyTimes="0;0.6;0.65;0.7;1" dur="4s" repeatCount="indefinite"/>
          </polygon>
          <circle cx="48" cy="-62" r="22" fill="#2b3440"/>
          <!-- glowing eyes that blink -->
          <circle cx="50" cy="-64" r="10" fill="url(#glow)"/>
          <circle cx="62" cy="-64" r="10" fill="url(#glow)"/>
          <ellipse cx="50" cy="-64" rx="3.4" ry="4.6" fill="#36BCF7">
            <animate attributeName="ry" values="4.6;4.6;0.4;4.6;4.6" keyTimes="0;0.9;0.93;0.96;1" dur="3.5s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse cx="62" cy="-64" rx="3.4" ry="4.6" fill="#36BCF7">
            <animate attributeName="ry" values="4.6;4.6;0.4;4.6;4.6" keyTimes="0;0.9;0.93;0.96;1" dur="3.5s" repeatCount="indefinite"/>
          </ellipse>
          <circle cx="51" cy="-66" r="1.2" fill="#fff"/>
          <circle cx="63" cy="-66" r="1.2" fill="#fff"/>
          <!-- nose, mouth, whiskers -->
          <path d="M66,-57 l-3,3 l-3,-3 z" fill="#f472b6"/>
          <path d="M63,-54 q-2,4 -6,3 M63,-54 q2,4 6,3" fill="none" stroke="#8b949e" stroke-width="1.2" stroke-linecap="round"/>
          <path d="M68,-56 l18,-4 M68,-53 l19,1 M68,-50 l17,5" stroke="#8b949e" stroke-width="1" stroke-linecap="round"/>
        </g>
      </g>

      <!-- back legs (pair B) -->
      <g transform="translate(-14 -20)">
        <animateTransform attributeName="transform" type="rotate" values="18 0 0;-18 0 0;18 0 0" dur="0.5s" repeatCount="indefinite" additive="sum"/>
        <rect x="-4.5" y="0" width="9" height="20" rx="4.5" fill="#2b3440"/>
        <ellipse cx="0" cy="19" rx="6" ry="3" fill="#36404d"/>
      </g>
      <!-- front legs (pair B) -->
      <g transform="translate(36 -20)">
        <animateTransform attributeName="transform" type="rotate" values="-18 0 0;18 0 0;-18 0 0" dur="0.5s" repeatCount="indefinite" additive="sum"/>
        <rect x="-4.5" y="0" width="9" height="20" rx="4.5" fill="#2b3440"/>
        <ellipse cx="0" cy="19" rx="6" ry="3" fill="#36404d"/>
      </g>

      <!-- little "meow" that pops up now and then -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.34;0.5;0.54;1" dur="16s" repeatCount="indefinite"/>
        <rect x="60" y="-128" width="62" height="24" rx="12" fill="#161b22" stroke="#36BCF7"/>
        <path d="M70,-104 l-6,8 l12,-8 z" fill="#161b22" stroke="#36BCF7"/>
        <text x="91" y="-111" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#36BCF7">meow</text>
      </g>
    </g>
  </g>
</svg>
