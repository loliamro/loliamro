<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="14" viewBox="0 0 1200 14">
  <defs>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36BCF7" stop-opacity="0"/><stop offset="0.5" stop-color="#36BCF7"/><stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="6.5" width="1200" height="1" fill="#30363d"/>
  <rect x="-240" y="5.5" width="240" height="3" rx="1.5" fill="url(#pulse)">
    <animate attributeName="x" from="-240" to="1200" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
